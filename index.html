<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Diary</title>

<style>
body {
    margin: 0;
    background: #222;
    overflow: hidden;
}

#book {
    width: 100vw;
    height: 100vh;
    margin: auto;
}

.page {
    background: #f5e6c8;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>

<body>

<div id="book"></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
const username = "Karthikeyan5318";
const repository = "My-document-";

const book = document.getElementById("book");

const pageFlip = new St.PageFlip(book, {
    width: 400,
    height: 600,
    size: "stretch",
    minWidth: 280,
    maxWidth: 800,
    minHeight: 400,
    maxHeight: 1100,
    showCover: true,
    mobileScrollSupport: false,
    maxShadowOpacity: 0.5
});

fetch(`https://api.github.com/repos/${username}/${repository}/contents/`)
.then(response => response.json())
.then(files => {

    const images = files
        .filter(file => file.type === "file" && file.name.toLowerCase().endsWith(".jpg"))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

    const pages = images.map(file => {
        return `
        <div class="page">
            <img src="${file.download_url}">
        </div>
        `;
    }).join("");

    book.innerHTML = pages;

    pageFlip.loadFromHTML(
        document.querySelectorAll(".page")
    );
})
.catch(error => {
    book.innerHTML = "<p style='color:white;text-align:center'>Document loading...</p>";
});
</script>

</body>
</html>
