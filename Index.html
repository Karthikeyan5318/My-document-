<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Diary</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8dce6;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
}

/* PASSWORD SCREEN */
#login {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #f8dce6, #f3c5d5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.login-box {
    width: 88%;
    max-width: 360px;
    padding: 35px 28px;
    text-align: center;
    background: #fff7f2;
    border: 2px solid #e7a9bd;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(120, 50, 75, 0.25);
}

.login-box h2 {
    margin: 0 0 8px;
    color: #9b4967;
    font-size: 27px;
}

.login-box p {
    color: #8a5266;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 15px 0;
    font-size: 18px;
    text-align: center;
    border: 1px solid #d99ab0;
    border-radius: 10px;
    outline: none;
    background: #fffafa;
}

.login-box button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #c96b8b;
    color: white;
}

#error {
    color: #b8325d;
    display: none;
}

/* FLIPBOOK */
#book {
    width: 100vw;
    height: calc(100vh - 70px);
}

.page {
    background: #fff7ec;
    overflow: hidden;
    border: 1px solid #e6c4c9;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* BUTTON BAR */
.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: #f3c5d5;
    border-top: 1px solid #d99ab0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    z-index: 1000;
}

.controls button {
    border: 1px solid #c96b8b;
    border-radius: 22px;
    padding: 10px 22px;
    font-family: Georgia, serif;
    font-size: 16px;
    background: #fff7f2;
    color: #93435f;
    box-shadow: 0 3px 8px rgba(120, 50, 75, 0.15);
}

.controls button:active {
    transform: scale(0.95);
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="login">

    <div class="login-box">

        <h2>🌸 My Diary 🌸</h2>

        <p>Enter Password</p>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="unlock()">Open Diary</button>

        <p id="error">Wrong password</p>

    </div>

</div>


<!-- FLIPBOOK -->
<div id="book"></div>


<!-- CONTROLS -->
<div class="controls">

    <button onclick="previousPage()">
        ◀ Previous
    </button>

    <button onclick="nextPage()">
        Next ▶
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>

const PASSWORD = "250502";

function unlock() {

    const entered =
        document.getElementById("password").value;

    if (entered === PASSWORD) {

        document.getElementById("login").style.display = "none";

        loadPages();

    } else {

        document.getElementById("error").style.display = "block";

    }
}


const USERNAME = "karthikeyan5318";
const REPOSITORY = "My-document-";

const book = document.getElementById("book");

let pageFlip;


function createBook() {

    pageFlip = new St.PageFlip(book, {

        width: 450,
        height: 650,

        size: "stretch",

        minWidth: 280,
        maxWidth: 1000,

        minHeight: 400,
        maxHeight: 1400,

        showCover: true,

        mobileScrollSupport: false,

        maxShadowOpacity: 0.5,

        flippingTime: 900

    });

}


async function loadPages() {

    try {

        const url =
        `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/contents/`;

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Unable to load files");
        }

        const files = await response.json();

        const images = files
            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|webp)$/i.test(file.name)
            )
            .sort((a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    { numeric: true }
                )
            );


        if (images.length === 0) {

            book.innerHTML =
            "<p style='color:#93435f;text-align:center;padding:30px'>No pages found.</p>";

            return;
        }


        createBook();


        const pageElements = [];


        images.forEach(file => {

            const page =
            document.createElement("div");

            page.className = "page";


            const image =
            document.createElement("img");

            image.src = file.download_url;

            image.alt = "Diary page";


            page.appendChild(image);

            book.appendChild(page);

            pageElements.push(page);

        });


        pageFlip.loadFromHTML(pageElements);

    }

    catch(error) {

        book.innerHTML =
        "<p style='color:#93435f;text-align:center;padding:30px'>Unable to load diary.</p>";

        console.error(error);

    }

}


function nextPage() {

    if (pageFlip) {
        pageFlip.flipNext();
    }

}


function previousPage() {

    if (pageFlip) {
        pageFlip.flipPrev();
    }

}

</script>

</body>
</html>
